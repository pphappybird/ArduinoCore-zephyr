# Headless Ethos-U55 inference server for the CM55 core.

CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_GPIO=n
CONFIG_CLOCK_CONTROL=n
CONFIG_WATCHDOG=n
CONFIG_LOG=n
CONFIG_ASSERT=n

CONFIG_MAIN_STACK_SIZE=8192
CONFIG_DYNAMIC_INTERRUPTS=y

CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBCPP=y

CONFIG_ML_MIDDLEWARE_INFINEON=y
CONFIG_ML_MIDDLEWARE_TFLITE_INTERPRETER=y
CONFIG_ML_MIDDLEWARE_INT8=y
CONFIG_ML_MIDDLEWARE_ETHOS_U55=y
