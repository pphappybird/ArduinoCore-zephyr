# Kconfig overlay for KIT-PSE84-AI (PSOC Edge E84, CM33 secure)
#
# NOTE: The board defconfig already provides:
#   CONFIG_GPIO=y
#   CONFIG_SERIAL=y
#   CONFIG_UART_CONSOLE=y
#   CONFIG_FPU=y
#   CONFIG_ARM_TRUSTZONE_M=y
#   CONFIG_TRUSTED_EXECUTION_SECURE=y
#   CONFIG_CORTEX_M_SYSTICK=y

# --- Bootloader ---
# Force MCUBoot off for Infineon KIT-PSE84-AI (PSOC Edge E84)
CONFIG_BOOTLOADER_MCUBOOT=n

# --- Stack / heap sizing for Arduino + LLEXT runtime ---
# CM33 SRAM (m33s_data) is only 132 KB — keep sizes minimal.
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=4096
# NNLite micro_speech requires a 48 KB LLEXT heap.
CONFIG_LLEXT_HEAP_SIZE=48
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1024

# --- XIP flash: read sketch directly from memory, no RAM copy needed ---
CONFIG_LLEXT_STORAGE_WRITABLE=n

# --- Peripheral drivers ---
CONFIG_I2C=y
CONFIG_SPI=y

# --- Audio: PDM digital microphone (dmic0) ---
CONFIG_DMA=y
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y

# Required by PDM.cpp's k_thread_stack_alloc() (mic-receiving thread stack)
CONFIG_THREAD_STACK_INFO=y
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_POOL_SIZE=2
CONFIG_DYNAMIC_THREAD_ALLOC=y

# Required for arch_irq_disconnect_dynamic, exported by loader/llext_exports.c
CONFIG_SHARED_INTERRUPTS=y

# Disable the loader boot banner.
CONFIG_BOOT_BANNER=n

# --- Override board defconfig for Arduino LLEXT loader ---
# Board defconfig enables MPU + HW_STACK_PROTECTION which the loader doesn't need
# and ASSERT which adds code size
CONFIG_ARM_MPU=n
CONFIG_HW_STACK_PROTECTION=n

# PSE84 QSPI has no Zephyr flash binding; disable so flash symbols aren't linked
CONFIG_FLASH=n
CONFIG_FLASH_MAP=n

# --- Build output ---
# CONFIG_BUILD_OUTPUT_BIN=n  # removed: conflicts with Zephyr default; use HEX instead

# --- NNLite / Infineon ML Middleware ---
# These options are PSE84-specific and belong in this board overlay.
CONFIG_CPP=y
CONFIG_STD_CPP17=y
# ml-middleware requires the full C++ library.
CONFIG_REQUIRES_FULL_LIBCPP=y

# Use the original Infineon TFLite implementation.
CONFIG_ML_MIDDLEWARE_INFINEON=y
CONFIG_ML_MIDDLEWARE_TFLITE_INTERPRETER=y
CONFIG_ML_MIDDLEWARE_INT8=y

CONFIG_ML_MIDDLEWARE_NNLITE=y

# NNLite runtime initialization connects interrupts dynamically.
CONFIG_DYNAMIC_INTERRUPTS=y

# Keep the source-built TFLM module disabled; the NNLite library is precompiled.
